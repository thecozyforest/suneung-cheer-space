version: 2
updates:
  # 라이브러리에 보안 문제가 생기면 Dependabot이 PR을 열어 준다
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    labels: ["의존성"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    labels: ["의존성"]
